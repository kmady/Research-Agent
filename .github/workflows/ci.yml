# Intégration continue : à chaque pull request et à chaque fusion dans main.
# Tout tourne sans GPU ni modèle : les tests utilisent des exécutants factices.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux du jeton GITHUB_TOKEN : lecture du code, rien d'autre.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q

  deps:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --extra dev
      # Liste exacte des dépendances livrées en production (sans les outils de dev).
      - run: uv export --frozen --extra web --no-dev --no-emit-project --no-hashes -o requirements-prod.txt
      - run: uv run pip-audit -r requirements-prod.txt

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: research-agent-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rapport Trivy (vulnérabilités élevées et critiques, informatif)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --quiet --no-progress --severity HIGH,CRITICAL --ignore-unfixed research-agent-web:ci
      - name: Bloquer si vulnérabilité critique corrigeable
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --quiet --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 research-agent-web:ci
      - name: Construire l'image SearXNG (sans la publier)
        uses: docker/build-push-action@v7
        with:
          context: deploy/searxng
          tags: research-agent-searxng:ci
