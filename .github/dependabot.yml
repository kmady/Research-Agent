# Dependabot : propose des PR de mise à jour des dépendances.
version: 2
updates:
  - package-ecosystem: "uv"            # pyproject.toml + uv.lock
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-mineures:                 # une seule PR pour les mises à jour mineures
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"        # image de base du Dockerfile
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    ignore:
      # Changer de version de Python est une décision volontaire (image + CI ensemble).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]


  - package-ecosystem: "github-actions" # versions des actions (workflows de l'étape 2)
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
