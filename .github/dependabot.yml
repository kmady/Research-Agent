# Dependabot : propose des PR de mise à jour des dépendances.
version: 2
updates:
  - package-ecosystem: "pip"           # dépendances de pyproject.toml
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-mineures:                 # une seule PR pour les mises à jour mineures
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"        # image de base du Dockerfile
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }

  - package-ecosystem: "github-actions" # versions des actions (workflows de l'étape 2)
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
